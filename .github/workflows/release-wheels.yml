name: Publish wheel release

on:
  push:
    branches: [main]
    paths:
      - 'wheels/**'
  workflow_dispatch:

concurrency:
  group: publish-wheel-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Validate wheels and update the catalogue
        run: |
          python -m unittest discover -s .github/tests -v
          python .github/scripts/release_wheels.py prepare
      - name: Save generated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CITATION.cff .zenodo.json releases.json SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update wheel catalogue and citation metadata'
            git push origin HEAD:main
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_wheels.py publish
